[project]
name = "adp-contracts"
version = "0.1.0"
description = "Shared contracts between the control plane and the execution plane"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adp_contracts"]
