[project]
name = "agent-runtime"
version = "0.1.0"
description = "Agent execution plane: plan, generate, validate, approve, deploy"
requires-python = ">=3.11"
dependencies = [
    "adp-contracts",
    "mcp-gateway",
    "anthropic>=0.40",
    "httpx>=0.27",
    "structlog>=24.4",
]

[project.scripts]
adp-run = "agent_runtime.cli:main"
adp-extract = "agent_runtime.registry.extract_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.uv.sources]
adp-contracts = { workspace = true }
mcp-gateway = { workspace = true }
