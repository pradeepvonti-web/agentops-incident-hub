[project]
name = "control-plane"
version = "0.1.0"
description = "Multi-tenant control plane: portal API, orchestrator, registry, evaluation"
requires-python = ">=3.11"
dependencies = [
    "adp-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "structlog>=24.4",
    "asyncpg>=0.30",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]

[tool.uv.sources]
adp-contracts = { workspace = true }
