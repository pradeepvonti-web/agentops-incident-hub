# Shared deploy steps. One definition, used by every environment.
#
# The whole point of a shared template: dev, test and prod run byte-identical
# steps and differ only in `target`. Divergence between environments is the
# failure mode bundles exist to remove, and three copy-pasted stages is how that
# divergence gets in.
#
# This file is platform-team property. Agents write resources/ and source/, never
# .azure/ -- an agent that can edit its own deploy steps can promote its own work.

parameters:
  - name: target
    type: string
    values: [dev, test, prod]
  - name: serviceConnection
    type: string

steps:
  - script: |
      set -euo pipefail
      curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      databricks --version
    displayName: Install Databricks CLI

  # Validate again, here, on the exact commit being deployed. The PR validated an
  # earlier commit; main may have moved. Re-validating costs seconds and is the
  # difference between "we checked" and "we checked this".
  - task: AzureCLI@2
    displayName: bundle validate (${{ parameters.target }})
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        databricks bundle validate -t ${{ parameters.target }}

  - task: AzureCLI@2
    displayName: bundle deploy (${{ parameters.target }})
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        databricks bundle deploy -t ${{ parameters.target }}

  # What now exists in the workspace, in the build log. When someone asks in six
  # months what this deployment changed, the answer is here rather than in
  # somebody's memory.
  - task: AzureCLI@2
    displayName: bundle summary (${{ parameters.target }})
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        databricks bundle summary -t ${{ parameters.target }}
