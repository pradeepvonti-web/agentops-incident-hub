name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      # Tests run offline: no Supabase credentials are configured in CI, and the
      # suite asserts the unconfigured behaviour on purpose.
      - run: cd backend && pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm install
      - run: cd frontend && npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  aidevops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd aidevops && uv sync
      - run: cd aidevops && uv run ruff check .
      # 6 tests skip without DATABASE_URL; the rest are security-property tests
      # over fakes and need no network.
      - run: cd aidevops && uv run pytest
